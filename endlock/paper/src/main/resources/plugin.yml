name: EndLock
version: '${version}'
main: dev.cornybirdy.endlock.EndLock
api-version: '26.1'
description: Turn ender chests and the End on or off with /endlock, also from the server console.
author: cornybirdy

permissions:
  endlock.admin:
    description: Use /endlock to turn ender chests and the End on or off.
    default: op
  endlock.bypass.enderchests:
    description: Keep using ender chests while they are turned off.
    default: false
  endlock.bypass.end:
    description: Keep using end portals and stay in the End while it is turned off.
    default: false
