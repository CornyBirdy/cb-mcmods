  end-state: "<gray>The End is <state><gray>."
  nether-state: "<gray>The Nether is <state><gray>."
  netherite-armor-state: "<gray>Netherite armor is <state><gray>."
  netherite-tools-state: "<gray>Netherite tools are <state><gray>."
  announce-ender-chests: "<gold>Ender chests have been <state><gold> by an admin."
  announce-end: "<gold>The End has been <state><gold> by an admin."
  announce-nether: "<gold>The Nether has been <state><gold> by an admin."
  announce-netherite-armor: "<gold>Netherite armor has been <state><gold> by an admin."
  announce-netherite-tools: "<gold>Netherite tools have been <state><gold> by an admin."
  pvp-status: "<gray>Your PvP is <state><gray>. Change it with /pvp on or /pvp off."
  pvp-now-on: "<red>PvP is on.</red> <gray>Players who also have PvP on can hurt you, and you them."
  pvp-now-off: "<green>PvP is off.</green> <gray>No player can hurt you, and you can't hurt them."
  pvp-already: "<gray>Your PvP is already <state><gray>."
