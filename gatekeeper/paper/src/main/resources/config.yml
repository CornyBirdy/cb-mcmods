  pvp-in-combat: "<red>You're in a fight. You can turn PvP off in <seconds>s."
  pvp-you-off: "<red>Your PvP is off. Use /pvp on to fight other players."
  pvp-they-off: "<red><player> has PvP off."
  pvp-players-only: "<red>Only players have a PvP setting. Use /gatekeeper pvp for the server settings."
  combat-tagged: "<red>You're in combat. Logging out in the next <seconds>s will kill you."
  combat-log-killed: "<red><player> logged out in combat and died."
  pvp-default-state: "<gray>New players start with PvP <state><gray>."
  pvp-cooldown-state: "<gray>Players wait <white><seconds>s</white> between /pvp changes."
  pvp-combat-state: "<gray>After a hit, players can't turn PvP off for <white><seconds>s</white>."
  combat-log-state: "<gray>Killing players who log out in combat is <state><gray>."
  enabled: "<green>enabled"
  disabled: "<red>disabled"
  reloaded: "<green>Gatekeeper config reloaded."
