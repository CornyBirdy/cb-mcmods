# Gatekeeper configuration
# The switches below are changed by /gatekeeper (in game or in the server console) and saved here,
# so they stay the same after a restart. You can also edit them here and run /gatekeeper reload.
# Messages use MiniMessage formatting: https://docs.advntr.dev/minimessage/format.html

# false = ender chests can't be opened, placed or crafted. Items already in them are kept.
ender-chests-enabled: true

# false = end portals go dark and anyone in the End is sent to the overworld spawn. Eyes can still be put
# in the frames; every portal lights up again as soon as the End is turned back on.
# The exit portal in the End keeps working.
end-enabled: true

# false = nether portals go dark and anyone in the Nether is sent to the overworld spawn. Frames can still
# be lit; every portal lights up again as soon as the Nether is turned back on.
# Unlike allow-nether in server.properties, this works straight away without a restart.
nether-enabled: true

# Tell everyone online when an admin turns ender chests, the End or the Nether on or off.
announce-ender-chests: false
announce-end: true
announce-nether: true

messages:
  ender-chest-blocked: "<red>Ender chests are disabled on this server."
  end-blocked: "<red>The End is disabled on this server."
  nether-blocked: "<red>The Nether is disabled on this server."
  end-portal-waiting: "<gray>The End is disabled, so this portal will open when it's turned back on."
  nether-portal-waiting: "<gray>The Nether is disabled, so this portal will open when it's turned back on."
  sent-out-of-end: "<red>The End is disabled, so you were sent back to spawn."
  sent-out-of-nether: "<red>The Nether is disabled, so you were sent back to spawn."
  # <state> is replaced by the enabled or disabled message below.
  ender-chests-state: "<gray>Ender chests are <state><gray>."
  end-state: "<gray>The End is <state><gray>."
  nether-state: "<gray>The Nether is <state><gray>."
  announce-ender-chests: "<gold>Ender chests have been <state><gold> by an admin."
  announce-end: "<gold>The End has been <state><gold> by an admin."
  announce-nether: "<gold>The Nether has been <state><gold> by an admin."
  enabled: "<green>enabled"
  disabled: "<red>disabled"
  reloaded: "<green>Gatekeeper config reloaded."
  usage: "<gray>/gatekeeper status <dark_gray>|</dark_gray> /gatekeeper enderchests|end|nether [on|off|toggle] <dark_gray>|</dark_gray> /gatekeeper reload"
