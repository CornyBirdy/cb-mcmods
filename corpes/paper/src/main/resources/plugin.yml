name: PaperCorpes
version: '${version}'
main: dev.cornybirdy.papercorpes.PaperCorpes
api-version: '26.1'
description: Server-side corpses. Your items stay with your body when you die.
author: cornybirdy

permissions:
  papercorpes.use:
    description: Use /corpse and see your own death history.
    default: true
  papercorpes.admin:
    description: Loot any corpse and browse anyone's deaths (see admin-see-all-deaths and admin-restore in config.yml).
    default: op
