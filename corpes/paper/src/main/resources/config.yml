# PaperCorpes configuration
# Messages use MiniMessage formatting: https://docs.advntr.dev/minimessage/format.html

# true = anyone can loot a corpse. false = only the owner (and players with papercorpes.admin).
allow-anyone-loot: true

# true = the dead player's XP is kept in the corpse instead of dropping as orbs.
# The first player to open the corpse gets it.
store-xp: false

# Minutes until a corpse turns into a skeleton (skull and bones). 0 = never.
skeleton-after-minutes: 60

# How many deaths per player /corpse history remembers.
history-size: 10

# Show the "<player>'s corpse" name above the body.
show-name: true

# How far away the name above a corpse can be seen, in blocks. The body itself is only drawn up close
# (about 12 blocks, the game decides this), so the name is what you spot from a distance.
# Players also need the corpse within the server's entity view range.
label-view-distance: 128

# true = the name shows through walls and terrain, like a waypoint.
label-see-through: false

# Size of the invisible box you right-click to open a corpse (in blocks).
hitbox-width: 2.0
hitbox-height: 0.6

# How long /corpse history can make a body glow so it can be found, in seconds. The outline shows through walls.
# 0 = turn highlighting off.
highlight-seconds: 30

# Admin options. Admins are players with papercorpes.admin.
# true = admins can browse every player's deaths and see what was in them (/corpse history).
admin-see-all-deaths: true
# true = admins can take items out of a death's inventory. The items are copies, so this duplicates them
# and the history is not changed. Use it to give back items a player lost.
admin-restore: false

# Date format used in history and on the corpse (Java DateTimeFormatter pattern).
date-format: "dd MMM HH:mm"

messages:
  corpse-name: "<gray><player>'s corpse"
  corpse-description: "<dark_gray>died <date>"
  remains-name: "<gray><player>'s remains"
  menu-title: "<player>'s corpse"
  # The player head in the top right corner of the menu.
  info-name: "<gold><player>'s corpse"
  info-name-remains: "<gold><player>'s remains"
  info-lore:
    - "<gray>Died <white><date>"
    - "<gray><cause>"
    - "<gray>At <white><x>, <y>, <z></white> in <white><world>"
    - ""
    - "<yellow><items></yellow> <gray>stacks left"
  # The /corpse history screens.
  history-title: "<player>'s deaths"
  players-title: "Deaths: all players (<page>/<pages>)"
  death-name: "<gold>Death #<index>"
  death-lore:
    - "<gray>Died <white><date>"
    - "<gray><cause>"
    - "<gray>At <white><x>, <y>, <z></white> in <white><world>"
    - "<yellow><items></yellow> <gray>stacks"
  # Added below the lines above: what became of the body, then a hint on what clicking does.
  death-status-body: "<green>The body is still there"
  death-status-remains: "<yellow>Only bones are left"
  death-status-gone: "<red>Emptied, nothing left to find"
  death-hint: "<dark_gray>Click to see what was in it"
  death-hint-highlight: "<dark_gray>Click: see inventory  Right-click: highlight"
  player-name: "<gold><player>"
  player-lore:
    - "<yellow><deaths></yellow> <gray>deaths on record"
    - "<gray>Last <white><date>"
    - ""
    - "<dark_gray>Click to see their deaths"
  players-button: "<aqua><bold>All players"
  players-button-lore:
    - "<gray>See everyone's deaths."
  back-players: "<yellow>Back to all players"
  back-players-lore: "<gray>Back to the list of players."
  own-deaths: "<yellow>Your deaths"
  own-deaths-lore: "<gray>Back to your own deaths."
  page-previous: "<yellow>Previous page"
  page-next: "<yellow>Next page"
  page-lore: ""
  back: "<yellow>Back"
  back-lore: "<gray>Back to the list of deaths."
  highlight: "<green><bold>Highlight the body"
  highlight-lore:
    - "<gray>Makes the body glow for <white><seconds></white> seconds,"
    - "<gray>even through walls, so you can find it."
  highlight-gone: "<red>Nothing to highlight"
  highlight-gone-lore: "<gray>This body was emptied and is gone."
  highlighted: "<green>Highlighting <player>'s body for <seconds>s, at <x>, <y>, <z> in <world>."
  highlight-unloaded: "<yellow>The body is too far away to highlight. It's at <x>, <y>, <z> in <world>."
  history-menu-title: "<player>'s death #<index>"
  history-info-name: "<gold><player>'s death #<index>"
  history-info-lore:
    - "<gray>Died <white><date>"
    - "<gray><cause>"
    - "<gray>At <white><x>, <y>, <z></white> in <white><world>"
    - "<yellow><items></yellow> <gray>stacks"
    - ""
    - "<aqua>Preview only: nothing can be taken out."
  history-info-lore-restore:
    - "<gray>Died <white><date>"
    - "<gray><cause>"
    - "<gray>At <white><x>, <y>, <z></white> in <white><world>"
    - "<yellow><items></yellow> <gray>stacks"
    - ""
    - "<aqua>Admin: items you take out are copies,"
    - "<aqua>so this duplicates them."
  # Labels shown in empty armour and offhand slots.
  slot-helmet: "<gray>Helmet"
  slot-chestplate: "<gray>Chestplate"
  slot-leggings: "<gray>Leggings"
  slot-boots: "<gray>Boots"
  slot-offhand: "<gray>Offhand"
  slot-empty: "<dark_gray>Empty"
  equip-all: "<green><bold>Equip all"
  equip-all-lore:
    - "<gray>Puts every item back in the"
    - "<gray>slot it was in when you died."
    - ""
    - "<dark_gray>Anything that doesn't fit stays here."
  take-all: "<gold><bold>Take all"
  take-all-lore:
    - "<gray>Moves everything into the free"
    - "<gray>slots of your inventory."
  not-yours: "<red>This is not your corpse."
  usage: "<gray>/corpse history [player] <dark_gray>|</dark_gray> /corpse view (player) (number) <dark_gray>|</dark_gray> /corpse reload"
  players-only: "<red>Only players can do that."
  no-permission: "<red>You don't have permission to do that."
  unknown-player: "<red>Unknown player: <player>"
  no-history: "<gray>No deaths recorded for <player>."
  invalid-number: "<red>There is no death #<index> for <player>."
  reloaded: "<green>PaperCorpes config reloaded."
