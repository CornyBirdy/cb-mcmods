name: Probe

# Temporary: dumps vanilla 26.3 signatures for the claim tool.
on:
  push:
    branches: [ccr-98618e67-5go0j0]
    paths: ['.github/probe/**', '.github/workflows/probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up Minecraft
        run: ./gradlew :gatekeeper-fabric:compileJava --no-daemon -q || true
      - name: Dump signatures
        run: bash .github/probe/probe.sh
