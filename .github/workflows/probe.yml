name: Probe

on:
  push:
    branches: [claude/exciting-ritchie-kkrpvg]
    paths: ['.github/probe/**', '.github/workflows/probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up Minecraft
        run: ./gradlew :gatekeeper-fabric:compileJava --no-daemon || true
      - name: Dump signatures
        run: bash .github/probe/probe.sh
