name: Probe

on:
  push:
    branches: [ccr-d356e0d6-vvowdm]
    paths: ['.github/probe/**', '.github/workflows/probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Fabric module
        run: ./gradlew :fabric:build --no-daemon --stacktrace || true
      - name: Dump signatures
        run: bash .github/probe/probe.sh
