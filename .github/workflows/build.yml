name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build every mod
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Corpes
          path: |
            corpes/paper/build/libs/PaperCorpes-*.jar
            corpes/fabric/build/libs/FabricCorpes-*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: EndLock
          path: |
            endlock/paper/build/libs/PaperEndLock-*.jar
            endlock/fabric/build/libs/FabricEndLock-*.jar
