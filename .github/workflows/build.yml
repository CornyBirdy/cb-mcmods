name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Paper plugin and Fabric mod
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PaperCorpes
          path: paper/build/libs/PaperCorpes-*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: FabricCorpes
          path: fabric/build/libs/FabricCorpes-*.jar
