name: Release

# Publish a release either by pushing a version tag (v1.2.3), or from the Actions tab with
# "Run workflow" and a version number, which creates the tag for you.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (e.g. 1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Work out version
        id: version
        run: echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build plugin
        run: ./gradlew build --no-daemon -PreleaseVersion="${{ steps.version.outputs.version }}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PaperCorpes ${{ steps.version.outputs.version }}
          files: build/libs/PaperCorpes-*.jar
          body_path: .github/release-notes.md
          generate_release_notes: true
          prerelease: true
